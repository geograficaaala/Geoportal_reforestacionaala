          payload = base64.b64decode(ARCHIVE_B64)
          if hashlib.sha256(payload).hexdigest() != ARCHIVE_SHA256:
              raise SystemExit("ERROR: comprobación SHA256 de la plantilla fallida")
          
          created = []
          unchanged = []
          with zipfile.ZipFile(io.BytesIO(payload)) as bundle:
              for entry in bundle.infolist():
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or '..' in name.parts or not name.parts:
                      raise SystemExit(f"Ruta inválida en la plantilla: {entry.filename}")
                  if name.parts[:2] == ('.github', 'workflows'):
                      raise SystemExit("No se permite crear workflows con el token automático")
                  target = Path(*name.parts)
                  if target.is_file():
                      unchanged.append(str(target))
                      continue
                  if target.exists() and not target.is_file():
                      raise SystemExit(f"Existe una carpeta donde se espera un archivo: {target}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(entry))
                  created.append(str(target))
          
          print(f"Plantilla inicializada: {len(created)} archivos creados, {len(unchanged)} conservados.")
          for item in created:
              print("  +", item)
          PY

      - name: Instalar dependencias y generar package-lock.json
        run: npm install --no-audit --no-fund

      - name: Revisar catálogo y geometrías disponibles
        run: python3 scripts/check_data.py

      - name: Compilar el geoportal para GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Guardar la arquitectura en la rama principal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'El repositorio ya estaba inicializado. Sin cambios que confirmar.'
          else
            git commit -m 'chore: crear estructura inicial del Geoportal AALA'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el geoportal
        id: deployment
        uses: actions/deploy-pages@v4
