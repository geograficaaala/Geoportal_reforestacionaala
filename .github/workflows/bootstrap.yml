
name: Reparar y publicar Geoportal AALA

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: geoportal-aala-reparacion
  cancel-in-progress: false

jobs:
  reparar-y-compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crear carpetas y corregir TypeScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import re
          import zipfile

          bootstrap = Path('.github/workflows/bootstrap.yml')

          if not bootstrap.is_file():
              raise SystemExit(
                  'Falta .github/workflows/bootstrap.yml en main'
              )

          content = bootstrap.read_text(encoding='utf-8')

          found = re.search(
              r'ARCHIVE_B64\s*=\s*"""\\?\s*\n(.*?)"""',
              content,
              re.S
          )

          sha = re.search(
              r'ARCHIVE_SHA256\s*=\s*"([0-9a-f]{64})"',
              content
          )

          if not found or not sha:
              raise SystemExit(
                  'No encontré la plantilla en bootstrap.yml'
              )

          archive = base64.b64decode(found.group(1))

          if hashlib.sha256(archive).hexdigest() != sha.group(1):
              raise SystemExit(
                  'Error de integridad en la plantilla'
              )

          created = 0

          with zipfile.ZipFile(io.BytesIO(archive)) as zip_file:
              for item in zip_file.infolist():
                  name = PurePosixPath(item.filename)

                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(
                          f'Ruta insegura: {name}'
                      )

                  if name.parts[:2] == ('.github', 'workflows'):
                      continue

                  if item.is_dir():
                      continue

                  destination = Path(*name.parts)

                  if destination.exists():
                      continue

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  destination.write_bytes(
                      zip_file.read(item)
                  )

                  created += 1

          # CORRECCIÓN 1: ImportMeta.env de Vite
          vite_types = Path('src/vite-env.d.ts')
          vite_types.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          if not vite_types.exists():
              vite_types.write_text(
                  '/// <reference types="vite/client" />\n',
                  encoding='utf-8'
              )

          # CORRECCIÓN 2: MapLibre GL JS
          map_file = Path('src/map/MapCanvas.tsx')

          if not map_file.exists():
              raise SystemExit(
                  'No se encontró MapCanvas.tsx'
              )

          original = map_file.read_text(
              encoding='utf-8'
          )

          updated = original.replace(
              'attributionControl: true,',
              'attributionControl: {},'
          )

          if updated != original:
              map_file.write_text(
                  updated,
                  encoding='utf-8'
              )

          print(f'Archivos creados: {created}')
          print('TypeScript corregido')
          print('MapLibre corregido')
          PY

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Guardar estructura corregida en main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes'
          else
            git commit -m 'fix: inicializar proyecto y corregir TypeScript'
            git push origin HEAD:main
          fi

      - name: Validar datos disponibles
        run: python3 scripts/check_data.py

      - name: Compilar proyecto
        run: npm run build
        env:
          VITE_BASE_PATH: /Geoportal_reforestacionaala/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  publicar:
    needs: reparar-y-compilar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
