# IMPORTANTE: pega este archivo en .github/workflows/bootstrap.yml de la rama main.
# Un solo workflow inicializa el proyecto y despliega en GitHub Pages.
# No necesita secretos ni tokens personales.
name: Inicializar y publicar Geoportal AALA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: geoportal-aala-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

